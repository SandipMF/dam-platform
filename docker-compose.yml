version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend/api
    env_file:
      - ./backend/api/.env.docker
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis
      - minio

  worker:
    build: ./backend/worker
    env_file:
      - ./backend/api/.env.docker
    depends_on:
      - mongo
      - redis
      - minio

  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  mongo_data:
  redis_data:
  minio_data:
